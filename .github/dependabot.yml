version: 2

# Keeps the SHA-pinned third-party actions and the `actions/*` refs from rotting silently — a re-pin
# lands as a reviewable PR. Grouped to one PR per week, not one per action.
#
# The ecosystem CLI pins live in src/targets/<eco>.json, not a package manifest, so Dependabot cannot
# bump them and no CI leg surfaces a stale one. Bump those by hand (see RELEASE.md).
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # The npm devDependencies are pinned to exact versions on purpose (see .npmrc); Dependabot is what
  # turns that pin from "stale forever" into a reviewable PR. Grouped weekly, like the actions above.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: chore
