name: CI

# A push run tests the branch tip; a pull_request run tests the merge preview. Both cover every
# branch, because stacked PRs need the merge-preview check as much as main-based ones do.
on:
  push:
    branches: ["**"]
  pull_request:

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default: CI reads code, holds no secrets, and needs no write scope.
# A job that ever needs more raises it locally; release.yml owns the privileged path.
permissions:
  contents: read

defaults:
  run:
    shell: bash

# Job graph: build -> {test, validate, smoke, complexity-scan, vulnerability-scan}, all parallel ->
# {mutation-py, mutation-ts}, main-only. Success gating is `needs:` throughout.
jobs:
  # ── Build gate — regenerate dist/ and prove it matches what's committed ──────
  # Runs first, so a src/content/ edit pushed without a rebuild fails before any test burns minutes.
  # Also emits the smoke matrix, one leg per registered ecosystem, so `smoke` needs no discovery job.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # GitHub evaluates a job's matrix BEFORE its `if:`, so the empty-include fallback keeps `smoke`'s
      # `fromJson` parsing valid JSON when `build` fails before this step sets the output.
      matrix: ${{ steps.matrix.outputs.matrix || '{"include":[]}' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      # The build gates and the matrix step below both run the TypeScript toolchain, so it must be
      # installed and compiled first — this job holds no npm-installed dependencies by default.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install the TypeScript toolchain
        run: make install-ts

      - name: Compile the TypeScript toolchain
        run: make compile

      # Drift (committed dist/ == fresh build), determinism (two builds byte-equal) and the
      # untracked-dist guard, all in src/release/ci/build_gates.sh.
      - name: Build gates (drift, determinism, tracked)
        run: make ci-build

      # Derived from the target registry (the single source of truth) and fail-closed on drift or
      # emptiness; `smoke` reads it straight from `needs.build`.
      - id: matrix
        name: Assemble the ecosystem smoke matrix (from the target registry)
        run: make smoke-matrix

  # ── Tests — always, on every branch ─────────────────────────────────────────
  test:
    name: Test
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      # Both runtimes: test-py covers src/hooks/ and its meta-guards, test-ts covers
      # src/{builder,release,metrics}/.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: make test

  # ── Validate the plugin package — manifests + single-source version ─────────
  # Gates packaging itself (marketplace-validate + version-check), with no Claude binary involved;
  # the end-to-end install smoke is the `smoke` job below.
  validate:
    name: Validate plugin package
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      # The validate step below runs the compiled TypeScript toolchain, which this job must install
      # itself — it holds no npm-installed dependencies by default.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install the TypeScript toolchain
        run: make install-ts

      - name: Compile the TypeScript toolchain
        run: make compile

      - name: Validate manifests and single-source version
        run: make validate

  # ── Ecosystem smoke checks — one parallel leg per ecosystem (matrix from `build`) ─────
  # The only job that loads the built plugin in a live CLI, so it gates: a real load regression fails
  # the pipeline instead of failing open. fail-fast:false keeps each ecosystem's result independent.
  smoke:
    name: Smoke — ${{ matrix.target }}
    needs: [build]
    # A custom `if:` replaces the implicit `if: success()`, so a failed `build` must be excluded here
    # explicitly — otherwise this job fans out against an empty matrix.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: make install

      # The CLI version is pinned, so an upstream release never turns this leg red — bump the pin by
      # hand (see RELEASE.md). Matrix values reach the script through env, never shell interpolation,
      # so a fork PR editing a smoke config cannot inject a command into this step.
      - name: Install ${{ matrix.cli }}
        env:
          INSTALL_METHOD: ${{ matrix.install_method }}
          NPM_PACKAGE: ${{ matrix.npm_package }}
          NPM_VERSION: ${{ matrix.npm_version }}
          INSTALL_URL: ${{ matrix.install_url }}
          INSTALL_FLAGS: ${{ matrix.install_flags }}
          CLI: ${{ matrix.cli }}
        run: make smoke-install

      # bash runs with `-eo pipefail` (GitHub's default), so a red pytest propagates through `tee`
      # and fails the leg.
      - name: Run ${{ matrix.target }} smoke check
        env:
          TEST: ${{ matrix.test }}
          TARGET: ${{ matrix.target }}
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_ENABLE_TELEMETRY: "0"
        run: make smoke-run

      - name: Annotate a red run
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
          CLI: ${{ matrix.cli }}
        run: make smoke-annotate

      - name: Upload smoke check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results-${{ matrix.target }}
          path: smoke-results-${{ matrix.target }}.txt

  # ── Static quality gates — every commit, parallel with test/validate/smoke ────
  # Both `needs: [build]` only, so they sit in the same tier as the correctness jobs. Each job id,
  # display name and make target is the same string, so a red check reproduces by copy-paste.

  # Cyclomatic + cognitive complexity <= 15, both runtimes — the same ceiling governs ESLint
  # (the TypeScript domains) and flake8 (the Python hooks). See CODE_OF_CONDUCT.md § Complexity.
  complexity-scan:
    name: complexity-scan
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Both runtimes: ESLint (Node) lints the TypeScript domains, flake8 (Python) the hooks.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: make install

      - name: Complexity gate (cyclomatic + cognitive, both runtimes)
        run: make complexity-scan

  # Fail on any high or critical dependency CVE. npm carries the whole dependency surface: the shipped
  # plugin is zero-runtime-dep and the Python hooks are stdlib-only. See CODE_OF_CONDUCT.md § Dependencies.
  vulnerability-scan:
    name: vulnerability-scan
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      # Resolve the exact locked tree first, so the audit reflects what CI and a consumer install.
      - name: Install the TypeScript toolchain
        run: make install-ts

      - name: Scan dependencies for high/critical CVEs
        run: make vulnerability-scan

  # ── Mutation testing — main only, the sole job at the end ─────────────────────
  # The one tier that waits: it `needs:` every fast check, so the slow run starts only on a green
  # tier. One job per runtime — mutmut over the Python island, Stryker over the TypeScript toolchain —
  # so the two mutate concurrently, and both gate release.yml. Their `if:` carries no status-check
  # function, so GitHub keeps the implicit needs-success requirement and the `if:` adds only the
  # main-push restriction. Job id, display name and make target are the same string in each.
  mutation-py:
    name: mutation-py
    needs: [test, validate, smoke, complexity-scan, vulnerability-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Measured locally: 491 mutants, ~3 minutes. 15 keeps 5x headroom while capping a genuine hang's cost.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Python only — mutmut has no use for Node, and src/hooks/ is stdlib-only.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: make install-py

      - name: Run mutation tests
        run: make mutation-py

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-py-results
          path: mutmut-results.txt

      # release.yml only fires on this workflow's overall success — a red gate here silently skips
      # the next release until someone checks CI, so name that consequence where it is actually seen.
      - name: Report a gate failure's release impact
        if: failure()
        run: make mutation-py-annotate

  mutation-ts:
    name: mutation-ts
    needs: [test, validate, smoke, complexity-scan, vulnerability-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Measured locally: 1594 mutants (src/metrics/ excluded — see stryker.conf.json), ~10 minutes at
    # concurrency 8 on a 10-core machine. CI's actual core count is unverified from here, so 30 keeps
    # real headroom without paying for a full 60-minute hang on a genuine failure.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Node only — Stryker mutates src/{builder,release}/, and has no use for Python.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: make install-ts

      - name: Run mutation tests
        run: make mutation-ts

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-ts-results
          path: reports/mutation/mutation.json

      # A job-level timeout skips every remaining step (this one included), so this only fires on a
      # gate FAILURE (below-threshold kill rate, malformed report) — but that case is otherwise just
      # as silent, so name the consequence here too. See RELEASE.md for the timeout case and recovery.
      - name: Report a gate failure's release impact
        if: failure()
        run: make mutation-ts-annotate
