name: CI

# Two triggers, two meanings — not a duplicate: a push run tests the BRANCH TIP on every
# commit (instant feedback, PR or not), a pull_request run tests the MERGE PREVIEW (the
# branch merged into its PR base — catches conflict-adjacent breakage the tip can't show).
# Deliberately NOT restricted to `branches: [main]`: this repo stacks PRs (feature -> feature
# -> main), and a merge-preview check is exactly as valuable at an intermediate stack level as
# it is at the final one — restricting it to main-based PRs would silently skip the pull_request
# merge-preview run on every stacked PR, which is most of them.
# The expensive mutation job stays gated to main pushes below; smoke runs on every commit.
on:
  push:
    branches: ["**"]
  pull_request:

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default: CI reads code, holds no secrets, and needs no write scope.
# A job that ever needs more raises it locally; release.yml owns the privileged path.
permissions:
  contents: read

defaults:
  run:
    shell: bash

# Job graph — three groups, each an escalating gate, cheap -> pricey so a cheap failure fails fast:
#
#            ┌─ GROUP 1: correctness ─┐   ┌─ GROUP 2: quality ──┐   ┌─ GROUP 3: mutation ─┐
#            │  (every commit)        │   │  (every commit)     │   │  (MAIN pushes only) │
#   build ──>│  test · validate · smoke │─>│  lint-complexity · audit │  mutation-py · mutation-ts
#            └────────────────────────┘   └─────────────────────┘   └─────────────────────┘
#
# The rule is UNIFORM: every group past the first `needs:` the whole correctness group and runs only
# if it went green — so quality (group 2) and mutation (group 3) never spend minutes on code that
# does not even pass its tests. Within a group the jobs run in PARALLEL (none needs another). The ONE
# difference across groups is group 3's `if:` — a single branch check (`push` to `main`) — because
# mutation is the slow release gate and PR feedback must stay fast; release.yml chains off this whole
# run's conclusion. Success gating is `needs:` itself everywhere (no hand-rolled `!cancelled()` +
# `.result` dialect): a plain `if:` with no status-check function keeps GitHub's implicit
# needs-success requirement. The smoke matrix is a `build` output (from the target registry), so
# there is no separate discovery job to sync.
jobs:
  # ── Build gate — regenerate dist/ and prove it matches what's committed ──────
  # Runs FIRST: a src/content/ edit pushed without a rebuild fails here (drift), before any
  # test burns minutes. Also proves the build is deterministic (two runs byte-equal)
  # and that dist/ is tracked, not silently git-ignored. Emits the smoke matrix (one leg per
  # registered ecosystem, from its src/targets/<eco>.json smoke config) so `smoke` needs no discovery job.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Default to an empty include so `smoke`'s `strategy.matrix: fromJson(needs.build.outputs.matrix)`
      # always parses valid JSON — GitHub evaluates a job's matrix BEFORE its `if:`, so if `build`
      # fails before the matrix step runs (a red drift gate, or the matrix step's own fail-closed
      # SystemExit), an unset output would make fromJson('') throw a confusing eval error instead of
      # letting `smoke`'s `needs.build.result == 'success'` guard skip it cleanly.
      matrix: ${{ steps.matrix.outputs.matrix || '{"include":[]}' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      # src/release/smokeMatrix.mts (below) imports the descriptor module, which validates via Zod,
      # and `make build`/`make build-check` themselves run the TypeScript compiler (`node
      # .ts-out/builder/bin/cli.mjs`, since commit 15) — so the TypeScript toolchain must be installed and
      # compiled BEFORE the build-gates step, not after. This job holds no npm-installed dependencies
      # by default (only setup-python).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install the TypeScript toolchain
        run: make install-ts

      - name: Compile the TypeScript toolchain
        run: make compile

      # Drift (committed dist/ == fresh build), determinism (two builds byte-equal), and the
      # untracked-dist guard — all in src/release/ci/build_gates.sh, which itself calls back through
      # `make build`/`make build-check` (the TypeScript compiler; this job never hardcodes it).
      - name: Build gates (drift, determinism, tracked)
        run: make ci-build

      # The smoke matrix, derived from the build's target registry (the single source of truth) and
      # fail-closed on drift/emptiness. A step output here means `smoke` reads it from `needs.build`
      # — no standalone "discover" node to drift out of sync.
      - id: matrix
        name: Assemble the ecosystem smoke matrix (from the target registry)
        run: make smoke-matrix

  # ── Tests — always, on every branch ─────────────────────────────────────────
  test:
    name: Test
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      # `make install` and `make test` each run a Python half and a TypeScript half, so this job
      # provisions both runtimes. The split is visible in the target names: test-py covers
      # src/hooks/ and its meta-guards, test-ts covers src/{builder,release,metrics}/.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: make test

  # ── Validate the plugin package — manifests + single-source version ─────────
  # Gates packaging itself (marketplace-validate + version-check). Runs without a
  # Claude binary; the end-to-end install smoke is the `smoke` job below.
  validate:
    name: Validate plugin package
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      # src/release/validatePackage.mts (below) needs the compiled TypeScript toolchain present —
      # this job holds no npm-installed dependencies by default (only setup-python).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install the TypeScript toolchain
        run: make install-ts

      - name: Compile the TypeScript toolchain
        run: make compile

      - name: Validate manifests and single-source version
        run: make validate

  # ── Ecosystem smoke checks — one PARALLEL leg per ecosystem (matrix from `build`) ─────
  # Does the built plugin actually install/load in the REAL Claude Code / OpenCode binary, not
  # just look correct on disk? This is the ONLY job that loads the plugin in a live CLI, so it
  # GATES: a genuine load regression fails the pipeline (and, on main, blocks the release that
  # chains off CI success) instead of failing open. A transient registry hiccup is absorbed by
  # the pinned install's own retry+timeout; a real load failure surfaces as the pytest step going
  # red. fail-fast:false keeps one ecosystem's result independent of the others'.
  # GROUP 1 alongside test/validate (needs only `build`): it fans out right after build for early
  # signal, rather than waiting on the unit suite. Groups 2 and 3 (below) wait for smoke to go green.
  smoke:
    name: Smoke — ${{ matrix.target }}
    needs: [build]
    # Runs on EVERY commit (push, all branches) and on PRs — smoke is a fast peer gate, not a
    # PR/main-only one, so a broken install or a plugin that no longer loads is caught on the commit
    # that introduced it. Custom `if:` replaces the implicit `if: success()`, so a failed `build` is
    # excluded explicitly (else this job would fan out against a broken/empty matrix); `!cancelled()`
    # keeps a clean skip when build is cancelled.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: make install

      # Pinned to the version verified when the check was written; the retry+timeout absorbs a
      # transient registry hiccup (a genuine outage, after 3 tries, fails only this ecosystem's
      # leg). Note: this blocking smoke installs the PINNED version, so it stays green after an
      # upstream release — a stale pin is NOT auto-surfaced here; bump it by hand (see RELEASE.md).
      # Matrix values are routed through env (not interpolated into the shell) so a fork PR that
      # edits a smoke.json can't inject a command into these run: steps.
      - name: Install ${{ matrix.cli }}
        env:
          INSTALL_METHOD: ${{ matrix.install_method }}
          NPM_PACKAGE: ${{ matrix.npm_package }}
          NPM_VERSION: ${{ matrix.npm_version }}
          INSTALL_URL: ${{ matrix.install_url }}
          INSTALL_FLAGS: ${{ matrix.install_flags }}
          CLI: ${{ matrix.cli }}
        run: make smoke-install

      # bash runs with `-eo pipefail` (GitHub default), so a red pytest propagates through `tee`
      # and fails the leg — the CLI `--version` above already failed the job if the binary is
      # absent, so this step can't silently all-skip to green.
      - name: Run ${{ matrix.target }} smoke check
        env:
          TEST: ${{ matrix.test }}
          TARGET: ${{ matrix.target }}
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_ENABLE_TELEMETRY: "0"
        run: make smoke-run

      - name: Annotate a red run
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
          CLI: ${{ matrix.cli }}
        run: make smoke-annotate

      - name: Upload smoke check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results-${{ matrix.target }}
          path: smoke-results-${{ matrix.target }}.txt

  # ── GROUP 2: static quality gates — every commit, after group 1, in parallel ──
  # Complexity and supply-chain audit. Both run on EVERY commit but only after group 1 (test +
  # validate + smoke) is green — no point judging quality until the code is proven correct. `needs:`
  # is the whole gate: a plain `if:` is not even needed, so GitHub's implicit needs-success applies
  # and a red group-1 job skips these cleanly. They run in parallel with each other (neither needs
  # the other). Each job id / display name / make target is the SAME string, so a red check
  # reproduces by copy-paste.

  # Cyclomatic + cognitive complexity <= 15, both runtimes — the same ceiling of 15 governs ESLint
  # (the TypeScript domains) and flake8 (the Python hooks). See CODE_OF_CONDUCT.md § Complexity.
  lint-complexity:
    name: lint-complexity
    needs: [test, validate, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Both runtimes: ESLint (Node) lints the TypeScript domains, flake8 (Python) the hooks.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: make install

      - name: Complexity gate (cyclomatic + cognitive, both runtimes)
        run: make lint-complexity

  # Fail on any HIGH or CRITICAL dependency CVE. npm carries the whole dependency surface (the shipped
  # plugin is zero-runtime-dep; the Python hooks are stdlib-only, so there is no pip runtime-CVE
  # surface). See CODE_OF_CONDUCT.md § Dependencies.
  audit:
    name: audit
    needs: [test, validate, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      # Resolve the exact locked tree first, so the audit reflects what CI (and a consumer) installs.
      - name: Install the TypeScript toolchain
        run: make install-ts

      - name: Audit dependencies for high/critical CVEs
        run: make audit

  # ── GROUP 3: mutation testing — MAIN ONLY, the release gate ───────────────────
  # The third and deepest tier. Two parallel jobs, one per runtime — the Python island (src/hooks/,
  # mutmut) is kept separate from the TypeScript toolchain (everything else, Stryker) precisely so
  # they run concurrently instead of as one ~40min sequential job. Both gate release.yml (which
  # chains off this whole CI run's conclusion). Deliberately MAIN-ONLY (post-merge), never on PRs:
  # the slow final quality gate — keeping it off PRs is what keeps PR feedback fast, and a merge to
  # main is the right, once-per-change place to pay for it.
  #
  # Gating is UNIFORM with groups 1 and 2: `needs:` alone requires test + validate + smoke to have
  # succeeded. The `if:` carries no status-check function (no `!cancelled()`/`always()`), so GitHub
  # keeps that implicit needs-success requirement — the `if:` adds ONLY the main-push restriction,
  # the single thing that sets group 3 apart from the every-commit groups. That one line is the
  # whole difference; there is no second gating dialect to learn.
  #
  # The job id, its display `name`, and its `make` target are the SAME string for each (mutation-py /
  # mutation-ts) — so a red check can be reproduced by copying its name straight into a terminal.
  mutation-py:
    name: mutation-py
    needs: [test, validate, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # mutmut now mutates only src/hooks/ (a few hundred lines) instead of also the former
    # Python compiler — expected well under the old combined ~40min figure, but unmeasured
    # at this scope; kept generous rather than tight until a real run establishes the actual ceiling.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Python only — mutmut has no use for Node, and src/hooks/ is stdlib-only.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: make install-py

      - name: Run mutation tests
        run: make mutation-py

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-py-results
          path: mutmut-results.txt

  mutation-ts:
    name: mutation-ts
    needs: [test, validate, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Node only — Stryker mutates src/{builder,release,metrics}/, and has no use for Python.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: make install-ts

      - name: Run mutation tests
        run: make mutation-ts

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-ts-results
          path: reports/mutation/mutation.json
