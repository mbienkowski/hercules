name: Release

# Every merge to main cuts a release: the bump comes from conventional commits (SemVer, `feat!:` or a
# `BREAKING CHANGE:` footer for major, minor by default), is written to package.json and
# pyproject.toml, committed back with [skip ci], tagged, and published as a GitHub Release.
# The job pushes directly to main, so a protection rule must allow this workflow (or a PAT) through.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Least-privilege by default: only the `release` job raises to contents:write, and `prepare` never
# sees a credential beyond the implicit read-only GITHUB_TOKEN.
permissions:
  contents: read

concurrency: release

jobs:
  # ── Compile the TypeScript toolchain, unprivileged (no contents:write, no NPM_TOKEN) ──────────
  # `npm ci` must never run in a job holding a push-capable or publish credential: a malicious
  # dependency's install-time code would inherit it. So the install and compile happen here under a
  # read-only checkout, and `release` consumes the compiled output as a build artifact instead.
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Pinned to the exact commit CI validated; a workflow_run checkout otherwise resolves to
          # main's current tip, which would compile the wrong tree.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install the TypeScript toolchain
        run: make install-ts

      - name: Compile the TypeScript toolchain
        run: make compile

      # node_modules travels WITH .ts-out: `tsc` transforms syntax without bundling, so the emitted
      # .mjs files still import their real npm packages (zod, via descriptor.mjs) at runtime. This
      # relocates the tree `prepare` resolved from the reviewed package-lock.json — the privileged
      # job still makes no fresh `npm ci` or network fetch of its own.
      - uses: actions/upload-artifact@v7
        with:
          name: ts-out
          path: |
            .ts-out
            node_modules
          retention-days: 1

  release:
    needs: [prepare]
    permissions:
      contents: write
    # Run only when CI passed; also skip the workflow's own release bump commit.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # On a workflow_run event the checkout resolves to main's current tip, which may have advanced
      # past the commit whose CI passed. Abort rather than release an unvalidated tree; the newer
      # commit's own release run covers it.
      - name: Verify checkout is the CI-validated commit
        env:
          WANT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: make release-verify

      # No setup-python: every step below is TypeScript. setVersion.mjs, updateChangelog.mjs and the
      # compiler all run from `prepare`'s downloaded artifact, so this job never runs `npm ci`.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/download-artifact@v8
        with:
          name: ts-out
          path: .

      # 1-pre. Detect a first release (no v* tags yet) and capture the previous tag, so git log can
      #        scope the commit range.
      - name: Detect first release
        id: meta
        run: make release-meta

      # 1. Compute the next version + changelog from conventional commits (no tag yet).
      - name: Compute next version
        id: bump
        # Pinned to a full commit SHA, never the mutable v6.2 tag: this job holds contents:write, so a
        # re-pointed upstream tag must not become code execution here. v6.2 is an annotated tag, so
        # the pin is `git rev-parse v6.2^{commit}` — the tag object's own SHA does not resolve.
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          initial_version: 1.0.0
          custom_tag: ${{ steps.meta.outputs.is_first == 'true' && '1.0.0' || '' }}
          dry_run: true

      # 2. Write the new version into the two literal sources: package.json (canonical) and
      #    pyproject.toml. Plugin manifests carry a ${version} token, injected at build in step 2b.
      - name: Bump version files
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: make release-version

      # 2b. Regenerate dist/ so the published artifacts carry the new version — the build injects the
      #     canonical package.json version into each manifest, which also keeps the drift gate green.
      - name: Rebuild dist/ to propagate the version
        run: make build

      # 3. Update CHANGELOG.md from git log (all commit subjects, not just conventional).
      #    First release overwrites the file; subsequent releases prepend.
      - name: Update CHANGELOG
        env:
          NEW_TAG:  ${{ steps.bump.outputs.new_tag }}
          PREV_TAG: ${{ steps.meta.outputs.prev_tag }}
          IS_FIRST: ${{ steps.meta.outputs.is_first }}
        run: make changelog

      # 4. Commit the bump + tag it (the tag points at the bumped commit).
      - name: Commit, tag, push
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: make release-commit

      # 5. Publish the GitHub Release with the aggregated notes.
      - name: GitHub Release
        # Pinned to a full commit SHA (not the mutable v1 major tag) — same supply-chain reason.
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ steps.bump.outputs.new_tag }}
          name: ${{ steps.bump.outputs.new_tag }}
          body: ${{ steps.bump.outputs.changelog }}

      # 6. Publish the OpenCode plugin to npm, an opt-in alternative channel (see RELEASE.md), scoped
      #    by `files: ["dist/opencode"]` and skipped when NPM_TOKEN is absent. The token is read in
      #    its own step emitting a boolean, not a job-level `env:`, so it is never in scope for the
      #    third-party tag/release actions above.
      - name: Check npm publish credentials
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: make npm-creds

      - name: Set up Node for npm publish
        if: steps.npm.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm publish
        if: steps.npm.outputs.enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: make release-npm
