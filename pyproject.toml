[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hercules"
version = "1.14.0"
description = "Hercules — Claude Code plugin with AI-assisted delivery methodology enforcement"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mutmut>=2.4,<3",
    # Complexity gate for the shipped Python hooks (`make complexity-scan`). Pinned EXACTLY, not by
    # range, for the same reason .npmrc pins the tokenizer exactly: a linter's algorithm can shift
    # scores between releases, and a gate whose verdict moves on a silent minor bump is not a gate.
    # flake8-cognitive-complexity provides CCR001 (SonarSource cognitive complexity); mccabe (C901,
    # cyclomatic) ships inside flake8. Dependabot proposes bumps as reviewable PRs.
    "flake8==7.3.0",
    "flake8-cognitive-complexity==0.1.0",
]

# No package is shipped — the deliverable is the compiled plugin tree under dist/claude-code/.
# The editable install exists only to pull in the dev/test toolchain.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
# `src` is on the path (not just ".") so the hook tests' `from hooks.tests.conftest import …` resolves
# `hooks` as a top-level package now that it lives at src/hooks/.
pythonpath = [".", "src"]
# Both islands carry a `tests/` package, so without namespace-package awareness pytest names
# each one just `tests` and the second collides with the first. This makes it use the full
# dotted path (`hooks.tests…`, `tools.tests…`), which is also how the test modules import.
consider_namespace_packages = true
# src/hooks/tests/ and src/tools/tests/ are SEPARATE trees from src/commons/repo/ (see
# CODE_OF_CONDUCT.md § Testing) — the two Python islands — so each must be listed explicitly.
testpaths = ["src/commons/repo", "src/hooks/tests", "src/tools/tests"]

[tool.mutmut]
# The two shipped-Python islands are the whole mutated surface: src/hooks/ (the ONE gate adapter
# every ecosystem ships) and src/tools/ (the programs a command invokes). Stryker covers the
# TypeScript side (`make mutation-ts`). Neither run gates anything — see CODE_OF_CONDUCT.md § Testing.
#
# The islands share no imports, so only src/hooks/tests/ can kill a src/hooks/ mutant and only
# src/tools/tests/ can kill a src/tools/ one. Mutating both at once therefore pays for the other
# island's suite on every mutant: `--paths-to-mutate src/tools/ --runner "python -m pytest
# src/tools/tests/ -x -q --tb=no --no-header"` is both faster and no weaker when you are hardening
# one island.
paths_to_mutate = "src/hooks/,src/tools/"
# Each island's tests/ nests INSIDE its own mutated tree, so both must be excluded explicitly or
# mutmut would mutate the tests themselves alongside the source they are supposed to be judging.
paths_to_exclude = "test_*.py,__init__.py,conftest.py,src/hooks/tests/*,src/tools/tests/*"
backup = false
# src/commons/repo/ carries nothing that exercises either island's mutation behavior, so the runner
# is each island's own tests and nothing else.
runner = "python -m pytest src/hooks/tests/ src/tools/tests/ -x -q --tb=no --no-header"
tests_dir = "src/hooks/tests/,src/tools/tests/"

[tool.coverage.run]
omit = [
    "src/commons/**/test_*.py", "src/commons/**/__init__.py", "src/commons/**/conftest.py",
    "src/hooks/tests/**/test_*.py", "src/hooks/tests/**/__init__.py", "src/hooks/tests/**/conftest.py",
    "src/tools/tests/**/test_*.py", "src/tools/tests/**/__init__.py", "src/tools/tests/**/conftest.py",
]
