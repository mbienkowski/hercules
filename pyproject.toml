[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hercules"
version = "1.10.0"
description = "Hercules — Claude Code plugin with AI-assisted delivery methodology enforcement"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mutmut>=2.4,<3",
]

# No package is shipped — the deliverable is the compiled plugin tree under dist/claude-code/.
# The editable install exists only to pull in the dev/test toolchain.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = [".", "tests-python"]
# tests-python/ is a SEPARATE tree from tests/ (see CODE_OF_CONDUCT.md § Testing) — the Python
# hooks island — so both must be listed explicitly.
testpaths = ["tests", "tests-python"]

[tool.mutmut]
# src/hooks/ — the shared enforcement hooks (the ONE gate adapter every ecosystem ships) — is the
# only mutated surface now that the Python compiler is gone; TypeScript's own Stryker mutation gate
# (`make mutation-ts`) covers everything that used to live in scripts/build/.
paths_to_mutate = "src/hooks/"
paths_to_exclude = "test_*.py,__init__.py,conftest.py"
backup = false
# tests-python/hooks/ is the hooks island's own tree (see CODE_OF_CONDUCT.md § Testing); the main
# tests/ tree carries nothing that exercises src/hooks/ mutation behavior, so narrowing the runner
# to tests-python/ alone is both correct and considerably faster than the pre-split full-suite run.
runner = "python -m pytest tests-python/ -x -q --tb=no --no-header"
tests_dir = "tests-python/"

[tool.coverage.run]
omit = ["tests/**/test_*.py", "tests/**/__init__.py", "tests/**/conftest.py"]
