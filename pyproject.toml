[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hercules"
version = "1.20.0"
description = "Hercules — Claude Code plugin with AI-assisted delivery methodology enforcement"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mutmut>=2.4,<3",
]

# No package is shipped — the deliverable is the compiled plugin tree under dist/claude-code/.
# The editable install exists only to pull in the dev/test toolchain.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
# "." is on the path so the top-level `tests` package resolves — the hook tests' `from
# tests.scripts.hooks.conftest import …` needs `tests.scripts.hooks` importable, and "src" stays
# alongside it so `hercules_gate.py`/`registry_sync.py`-style sibling imports still resolve once each
# conftest inserts its own src/scripts/hooks or src/scripts/tools onto sys.path directly.
pythonpath = [".", "src"]
# Both islands nest under the one top-level `tests` package, so without namespace-package awareness
# pytest names each one just `tests` and the second collides with the first. This makes it use the
# full dotted path (`tests.scripts.hooks…`, `tests.scripts.tools…`), which is also how the test
# modules import.
consider_namespace_packages = true
# tests/scripts/hooks/ and tests/scripts/tools/ are SEPARATE trees from tests/repo/ (see
# CODE_OF_CONDUCT.md § Testing) — the two Python islands — so each must be listed explicitly.
testpaths = ["tests/repo", "tests/scripts/hooks", "tests/scripts/tools"]
# Every transient tool output lives under the one gitignored /.local/ tree (see .gitignore).
cache_dir = ".local/pytest-cache"

[tool.mutmut]
# The two shipped-Python islands are the whole mutated surface: src/scripts/hooks/ (the ONE gate
# adapter every ecosystem ships) and src/scripts/tools/ (the programs a command invokes). Stryker
# covers the TypeScript side (`make mutation-ts`). Neither run gates anything — see
# CODE_OF_CONDUCT.md § Testing.
#
# The islands share no imports, so only tests/scripts/hooks/ can kill a src/scripts/hooks/ mutant and
# only tests/scripts/tools/ can kill a src/scripts/tools/ one. Mutating both at once therefore pays
# for the other island's suite on every mutant: `--paths-to-mutate src/scripts/tools/ --runner
# "python -m pytest tests/scripts/tools/ -x -q --tb=no --no-header"` is both faster and no weaker
# when you are hardening one island.
paths_to_mutate = "src/scripts/hooks/,src/scripts/tools/"
# Each island's tests/ now lives in a separate top-level tree rather than nested inside its own
# mutated source, so mutmut never walks into it in the first place; the filename globs stay as a
# defensive guard against a stray test-named file ever landing back under src/scripts/hooks/ or
# src/scripts/tools/.
paths_to_exclude = "test_*.py,__init__.py,conftest.py"
backup = false
# tests/repo/ carries nothing that exercises either island's mutation behavior, so the runner
# is each island's own tests and nothing else.
runner = "python -m pytest tests/scripts/hooks/ tests/scripts/tools/ -x -q --tb=no --no-header"
tests_dir = "tests/scripts/hooks/,tests/scripts/tools/"

[tool.coverage.run]
# No `omit` needed: `--cov=src/scripts/hooks --cov=src/scripts/tools` (Makefile) only ever measures
# those two trees, and every test file now lives in the separate top-level tests/ tree, never nested
# inside either. Every transient tool output lives under the one gitignored /.local/ tree (see
# .gitignore).
data_file = ".local/.coverage"
