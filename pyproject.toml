[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hercules"
version = "1.10.0"
description = "Hercules — Claude Code plugin with AI-assisted delivery methodology enforcement"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mutmut>=2.4,<3",
    # Complexity gate for the shipped Python hooks (`make complexity-scan`). Pinned EXACTLY, not by
    # range, for the same reason .npmrc pins the tokenizer exactly: a linter's algorithm can shift
    # scores between releases, and a gate whose verdict moves on a silent minor bump is not a gate.
    # flake8-cognitive-complexity provides CCR001 (SonarSource cognitive complexity); mccabe (C901,
    # cyclomatic) ships inside flake8. Dependabot proposes bumps as reviewable PRs.
    "flake8==7.3.0",
    "flake8-cognitive-complexity==0.1.0",
]

# No package is shipped — the deliverable is the compiled plugin tree under dist/claude-code/.
# The editable install exists only to pull in the dev/test toolchain.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
# `src` is on the path (not just ".") so the hook tests' `from hooks.tests.conftest import …` resolves
# `hooks` as a top-level package now that it lives at src/hooks/.
pythonpath = [".", "src"]
# src/hooks/tests/ is a SEPARATE tree from src/commons/repo/ (see CODE_OF_CONDUCT.md § Testing) — the
# Python hooks island — so both must be listed explicitly.
testpaths = ["src/commons/repo", "src/hooks/tests"]

[tool.mutmut]
# src/hooks/ — the shared enforcement hooks (the ONE gate adapter every ecosystem ships) — is the
# only mutated surface now that the Python compiler is gone; TypeScript's own Stryker mutation gate
# (`make mutation-ts`) covers everything that used to live in the retired Python compiler.
paths_to_mutate = "src/hooks/"
# src/hooks/tests/ nests INSIDE the mutated tree, so it must be excluded explicitly or mutmut would
# mutate the tests themselves alongside the hook source they're supposed to be judging.
paths_to_exclude = "test_*.py,__init__.py,conftest.py,src/hooks/tests/*"
backup = false
# src/hooks/tests/ is the hooks island's own tree (see CODE_OF_CONDUCT.md § Testing); src/commons/repo/
# carries nothing that exercises src/hooks/ mutation behavior, so narrowing the runner to
# src/hooks/tests/ alone is both correct and considerably faster than the pre-split full-suite run.
runner = "python -m pytest src/hooks/tests/ -x -q --tb=no --no-header"
tests_dir = "src/hooks/tests/"

[tool.coverage.run]
omit = [
    "src/commons/**/test_*.py", "src/commons/**/__init__.py", "src/commons/**/conftest.py",
    "src/hooks/tests/**/test_*.py", "src/hooks/tests/**/__init__.py", "src/hooks/tests/**/conftest.py",
]
